name: Update yt-dlp

# Checks daily for a new yt-dlp release. If one exists, layers the update
# on top of the currently deployed image (app code stays untouched).

on:
  schedule:
    # Daily at 4:00 AM UTC
    - cron: "0 4 * * *"
  workflow_dispatch: # Allow manual trigger (always rebuilds)

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/content-app

permissions:
  contents: read
  packages: write

jobs:
  check-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for new yt-dlp version on PyPI
        id: version_check
        run: |
          LATEST=$(pip3 index versions yt-dlp 2>/dev/null | head -1 | grep -oP '\(\K[^)]+')
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"
          echo "Latest yt-dlp on PyPI: $LATEST"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A registry tag only proves an image was pushed. The server is the source
      # of truth: a prior deploy could have failed, or a later app deploy could
      # have replaced :latest.
      - name: Read yt-dlp version running on Vultr
        id: running_version
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VULTR_SSH_HOST }}
          username: ${{ secrets.VULTR_SSH_USER }}
          key: ${{ secrets.VULTR_SSH_PRIVATE_KEY }}
          capture_stdout: true
          script: |
            set -eu
            cd /root/content-backend
            docker compose -f docker-compose.prod.yml exec -T app yt-dlp --version

      - name: Decide whether the running server needs an update
        id: should_update
        run: |
          normalise() { echo "$1" | tr -d '[:space:]' | awk -F. '{printf "%d.%d.%d\\n", $1, $2, $3}'; }
          LATEST=$(normalise "${{ steps.version_check.outputs.latest }}")
          RUNNING=$(normalise "${{ steps.running_version.outputs.stdout }}")
          echo "Latest on PyPI: $LATEST | Running on Vultr: $RUNNING"

          if [ "$LATEST" = "$RUNNING" ] && [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            echo "update=false" >> "$GITHUB_OUTPUT"
            echo "Vultr already runs yt-dlp $LATEST — skipping"
          else
            echo "update=true" >> "$GITHUB_OUTPUT"
            echo "Vultr needs yt-dlp $LATEST — will update"
          fi

      - name: Pull currently deployed image
        if: steps.should_update.outputs.update == 'true'
        run: docker pull ${{ env.IMAGE }}:latest

      - name: Build updated image (yt-dlp only, app code untouched)
        if: steps.should_update.outputs.update == 'true'
        run: |
          cat <<'EOF' | docker build --platform linux/amd64 \
            -t ${{ env.IMAGE }}:latest \
            -t ${{ env.IMAGE }}:ytdlp-${{ steps.version_check.outputs.latest }} \
            -f - .
          FROM ${{ env.IMAGE }}:latest
          USER root
          RUN pip3 install --break-system-packages --upgrade "yt-dlp[curl-cffi]"
          USER app
          EOF

      - name: Smoke test — verify yt-dlp works in the new image
        if: steps.should_update.outputs.update == 'true'
        run: |
          # PyPI returns "2026.3.17", yt-dlp reports "2026.03.17" — normalise by removing leading zeros from each segment
          normalise() { echo "$1" | awk -F. '{printf "%d.%d.%d\n", $1, $2, $3}'; }
          EXPECTED=$(normalise "${{ steps.version_check.outputs.latest }}")
          ACTUAL=$(normalise "$(docker run --rm --entrypoint yt-dlp ${{ env.IMAGE }}:latest --version 2>&1)")
          echo "Expected: $EXPECTED | Actual: $ACTUAL"
          if [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "::error::yt-dlp version mismatch — aborting deploy"
            exit 1
          fi
          echo "Smoke test passed ✅"

      - name: Push image
        if: steps.should_update.outputs.update == 'true'
        run: |
          docker push ${{ env.IMAGE }}:latest
          docker push ${{ env.IMAGE }}:ytdlp-${{ steps.version_check.outputs.latest }}

      - name: Deploy to Vultr VM
        if: steps.should_update.outputs.update == 'true'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VULTR_SSH_HOST }}
          username: ${{ secrets.VULTR_SSH_USER }}
          key: ${{ secrets.VULTR_SSH_PRIVATE_KEY }}
          script: |
            set -eu
            docker pull ghcr.io/${{ github.repository_owner }}/content-app:latest
            cd /root/content-backend
            docker compose -f docker-compose.prod.yml up -d app
            normalise() { echo "$1" | tr -d '[:space:]' | awk -F. '{printf "%d.%d.%d\\n", $1, $2, $3}'; }
            EXPECTED=$(normalise "${{ steps.version_check.outputs.latest }}")
            ACTUAL=$(normalise "$(docker compose -f docker-compose.prod.yml exec -T app yt-dlp --version)")
            echo "Expected: $EXPECTED | Running on Vultr: $ACTUAL"
            test "$EXPECTED" = "$ACTUAL"
