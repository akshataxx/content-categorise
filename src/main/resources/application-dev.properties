# Development profile overrides

# Keep the local console readable; background job polling can otherwise spam the
# same claim query every cycle.
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Local Apple StoreKit testing should not require App Store Server API keys.
apple.app-store.environment=${APPLE_ENVIRONMENT:xcode-testing}

# Local development can hit real OpenAI endpoints by default; override to `mock`
# when you want a cheap/offline run.
app.openai.mode=${APP_OPENAI_MODE:real}
