# Test configuration for Testcontainers
# These will be overridden by Testcontainers dynamic configuration

# Disable security for tests
spring.security.enabled=false

# JPA/Hibernate settings for tests
# Testcontainers databases are ephemeral, so there is no need to drop schema at
# Spring context shutdown after the container may already be stopped.
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Flyway settings
spring.flyway.enabled=false
spring.flyway.clean-disabled=false
spring.flyway.validate-on-migrate=false

# Background jobs should not run during tests; full-context tests use
# Testcontainers databases that are torn down as soon as the test completes.
app.jobs.poller.enabled=false
app.media-executor.wait-for-tasks-on-shutdown=false
app.media-executor.await-termination-seconds=5

# JWT test overrides
app.jwtSecret=abcdefghijklmnopqrstuvwxyz0123456789abcdefghijklmnopqrstuvwxyz0123456789abcdabcdabcd
app.jwtExpirationInMs=3600000
app.jwtRefreshExpirationInMs=86400000

google.client-id=test-client-id

# Logging - keep quiet in tests
logging.level.org.springframework.jdbc=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN

# FFmpeg configuration for tests
app.ffmpeg.location=/opt/homebrew/bin/ffmpeg
# yt-dlp timeout for tests
app.ytdlp.timeout-minutes=4
